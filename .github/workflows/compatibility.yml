name: Compatibility
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-lock.txt .
      - run: python -c "import remote_intent; import sys; assert 'fastmcp' not in sys.modules"
      - run: python -m pip install -c requirements-lock.txt -e '.[dev,mcp,llm-eval]'
      - run: python -m pytest
  compatibility-gate:
    runs-on: ubuntu-latest
    needs: matrix
    if: always()
    steps:
      - if: needs.matrix.result != 'success'
        run: exit 1
